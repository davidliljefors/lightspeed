name: build

# Every push and PR builds, tests and packages everything (a dry run of the
# release). Pushing a `v*` tag also publishes a GitHub release.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, target: win32-x64, ext: .exe }
          - { os: windows-11-arm, target: win32-arm64, ext: .exe }
#         - { os: macos-latest, target: darwin-arm64, ext: "" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: cargo build --release
      - run: cargo test --release
      - name: Package VS Code extension
        shell: bash
        working-directory: editors/vscode
        run: |
          mkdir -p bin
          cp ../../target/release/lightspeed${{ matrix.ext }} bin/
          npm install
          npm run compile
          npx vsce package --skip-license --target ${{ matrix.target }} -o ../../lightspeed-${{ matrix.target }}.vsix
      - name: Name the binary
        shell: bash
        run: cp target/release/lightspeed${{ matrix.ext }} lightspeed-${{ matrix.target }}${{ matrix.ext }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            lightspeed-${{ matrix.target }}.vsix
            lightspeed-${{ matrix.target }}${{ matrix.ext }}

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - env: { GH_TOKEN: "${{ github.token }}", GH_REPO: "${{ github.repository }}" }
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*
