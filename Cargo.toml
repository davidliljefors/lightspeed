[package]
name = "lightspeed"
version = "0.1.0"
edition = "2024"

[dependencies]
hashbrown = "0.17.1"
lz4_flex = "0.11"
memchr = "2.8.3"
memmap2 = "0.9.12"
mimalloc = "0.1.52"
notify = "8"
rayon = "1.12.0"
regex = "1"
rustc-hash = "2.1.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.13"

[dev-dependencies]
criterion = "0.8.2"
tempfile = "3.27.0"

[[bin]]
name = "lightspeed"
path = "src/main.rs"

[[bench]]
name = "lexer"
harness = false

[[bench]]
name = "ingest"
harness = false

[[bench]]
name = "preprocessor"
harness = false

[[bench]]
name = "symbols"
harness = false

[[bench]]
name = "parser"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = 1

[profile.bench]
inherits = "release"
